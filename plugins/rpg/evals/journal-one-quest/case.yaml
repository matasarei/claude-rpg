schema_version: "1.1"
name: journal-one-quest
description: >
  The journal with one quest awaiting judgement and one sidequest found. The Road table is
  injected into the skill, so the answer must come without opening any quest file: the active
  quest, its state, its last Log line and last ruling, the sidequest with a suggested word, and
  the exact --continue command in the Next block.
tags: [journal, local-tools-first]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rpg:journal
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]

runs: 2

expected_outcome: >
  A banner "⚔ Export departments as CSV · awaiting", the quest's branch and pull request, the
  ruling about the CSV writer, the sidequest side-null-head with a now/after suggestion, and a
  Next block containing `/rpg:quest --continue .quests/export-csv.md`. No Read of a file under
  .quests/ in the transcript.
